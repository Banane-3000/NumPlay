name: Monkey Mart

on:
  pull_request:
    paths:
      - 'games/monkeymart/**'
      - 'games/common/**'
      - 'tools/emu.py'
      - 'Makefile'
      - '.github/workflows/monkeymart.yml'
  push:
    branches: [main]
    paths:
      - 'games/monkeymart/**'
      - 'games/common/**'
      - '.github/workflows/monkeymart.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: ARM toolchain
        run: |
          v=15.2.1-1.1
          curl -fsSL "https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v$v/xpack-arm-none-eabi-gcc-$v-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xpack-arm-none-eabi-gcc-$v/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tools
        run: |
          npm install -g nwlink@1.0.0
          pip install pillow numpy pyelftools unicorn==2.1.4
      - name: Build and test Monkey Mart
        run: |
          make build/data/apps/MonkeyMart.nwa NWLINK=nwlink
          make -C games/monkeymart check test NWLINK=nwlink
          make -C games/monkeymart test-assets
      - name: ARM profiles, saves and safe exit
        run: python3 games/monkeymart/tests/test_arm.py --nwlink nwlink
      - uses: actions/upload-artifact@v4
        with:
          name: Monkey Mart
          path: build/data/apps/MonkeyMart.nwa
