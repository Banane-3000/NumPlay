name: Core Ball

on:
  pull_request:
    paths:
      - 'games/coreball/**'
      - 'games/common/**'
      - 'tools/emu.py'
      - 'Makefile'
      - '.github/workflows/coreball.yml'
  push:
    branches: [main]
    paths:
      - 'games/coreball/**'
      - 'games/common/**'
      - '.github/workflows/coreball.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: ARM toolchain
        run: |
          v=15.2.1-1.1
          curl -fsSL "https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v$v/xpack-arm-none-eabi-gcc-$v-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xpack-arm-none-eabi-gcc-$v/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tools
        run: |
          npm install -g nwlink@1.0.0
          pip install pillow numpy pyelftools unicorn==2.1.4
      - name: Build and test Core Ball
        run: |
          make build/apps/CoreBall.nwa NWLINK=nwlink
          make -C games/coreball check test NWLINK=nwlink
      - name: Compare with the pinned original
        run: |
          mkdir -p build/coreball-reference/js
          curl -fsSL "https://raw.githubusercontent.com/Gr4ys0n/Gr4ys0n.github.io/29006b0f11904704c390b457f7055c9fa1e53484/public/assets/games/core-ball/js/index.js" -o build/coreball-reference/js/index.js
          make -C games/coreball fidelity HOST_CC=cc
      - name: ARM profiles, saves and safe exit
        run: python3 games/coreball/tests/test_arm.py --nwlink nwlink
      - uses: actions/upload-artifact@v4
        with:
          name: CoreBall
          path: build/apps/CoreBall.nwa
