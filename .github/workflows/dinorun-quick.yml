name: Dino Run (quick test build)

# Fast build for the standalone game only. No release publishing.
# Works on any feature branch when the new files are pushed.
on:
  push:
    paths:
      - 'games/dinorun/**'
      - '.github/workflows/dinorun-quick.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dino:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: ARM compiler
        run: |
          v=15.2.1-1.1
          curl -fsSL "https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v$v/xpack-arm-none-eabi-gcc-$v-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xpack-arm-none-eabi-gcc-$v/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: NumWorks compiler helpers
        run: npm install -g nwlink@1.0.0

      - name: Host unit tests
        run: make -C games/dinorun host-test

      - name: Build native calculator app
        run: make -C games/dinorun check NWLINK=nwlink

      - uses: actions/upload-artifact@v4
        with:
          name: DinoRun-nwa
          path: games/dinorun/output/dinorun.nwa
          if-no-files-found: error
