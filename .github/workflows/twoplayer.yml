name: 2 Players

on:
  pull_request:
    paths:
      - 'games/twoplayer/**'
      - 'games/common/**'
      - 'launcher/src/**'
      - 'tools/emu.py'
      - 'tools/gen_games.py'
      - 'tools/npmodule.py'
      - 'games/games.json'
      - '.github/workflows/twoplayer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: ARM toolchain
        run: |
          v=15.2.1-1.1
          curl -fsSL "https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v$v/xpack-arm-none-eabi-gcc-$v-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xpack-arm-none-eabi-gcc-$v/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tools
        run: |
          npm install -g nwlink@1.0.0
          pip install pillow==11.3.0 numpy pyelftools unicorn==2.1.4
      - name: Existing game build and engine checks
        run: |
          make build/data/apps/TwoPlayers.nwa build/data/modules/twoplayer.o NWLINK=nwlink
          make -C games/twoplayer build module check test HOST_CC=gcc NWLINK=nwlink
      - name: ARM controls, saves and firmware guards
        run: python3 games/twoplayer/tests/test_arm.py --nwlink nwlink
      - name: Existing NumPlay launcher integration
        run: python3 games/twoplayer/tests/test_integration.py --nwlink nwlink
      - name: French and Chinese layouts
        run: python3 games/twoplayer/tests/test_languages.py
      - uses: actions/upload-artifact@v4
        with:
          name: TwoPlayers
          path: build/data/apps/TwoPlayers.nwa
